<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Princessss' Universe ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
}

#title {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #ff4fa3, 0 0 25px #ff1493;
    pointer-events: none;
    z-index: 10;
}

#instruction {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-family: Arial, sans-serif;
    font-size: 13px;
    pointer-events: none;
    z-index: 10;
}
</style>

<!-- This fixes the Three.js module loading -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="title">PRINCESSS' UNIVERSE</div>

<div id="instruction">
Drag to explore • Scroll to zoom
</div>

<script type="module">

import * as THREE from "three";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


// ==============================
// SCENE
// ==============================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


// ==============================
// CAMERA
// ==============================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0, 0, 75);


// ==============================
// RENDERER
// ==============================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ==============================
// CONTROLS
// ==============================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.minDistance = 25;
controls.maxDistance = 250;


// ==============================
// STARS
// ==============================

const starGeometry = new THREE.BufferGeometry();

const starCount = 6000;

const starPositions = new Float32Array(
    starCount * 3
);

for (let i = 0; i < starCount * 3; i++) {

    starPositions[i] =
        (Math.random() - 0.5) * 1000;

}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.2,
    sizeAttenuation: true
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);


// ==============================
// HEART FUNCTION
// ==============================

function heartPoint(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return { x, y };
}


// ==============================
// HEART PARTICLES
// ==============================

const heartGeometry = new THREE.BufferGeometry();

const heartCount = 10000;

const heartPositions =
    new Float32Array(heartCount * 3);

for (let i = 0; i < heartCount; i++) {

    const t =
        Math.random() * Math.PI * 2;

    const point = heartPoint(t);

    const thickness =
        Math.sqrt(Math.random());

    const x =
        point.x * thickness * 0.9;

    const y =
        point.y * thickness * 0.9;

    const z =
        (Math.random() - 0.5) *
        8 *
        thickness;

    const index = i * 3;

    heartPositions[index] = x;
    heartPositions[index + 1] = y;
    heartPositions[index + 2] = z;
}

heartGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        heartPositions,
        3
    )
);


// ==============================
// HEART MATERIAL
// ==============================

const heartMaterial =
    new THREE.PointsMaterial({

        color: 0xff4fa3,

        size: 0.34,

        transparent: true,

        opacity: 0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false

    });


// ==============================
// HEART
// ==============================

const heart = new THREE.Points(
    heartGeometry,
    heartMaterial
);

scene.add(heart);


// ==============================
// GLOW
// ==============================

const glowGeometry =
    new THREE.SphereGeometry(
        18,
        32,
        32
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff1493,

        transparent: true,

        opacity: 0.025,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false

    });

const glow = new THREE.Mesh(
    glowGeometry,
    glowMaterial
);

scene.add(glow);


// ==============================
// ANIMATION
// ==============================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time =
        clock.getElapsedTime();


    // Gentle rotation
    heart.rotation.y =
        time * 0.15;


    // Heartbeat
    const beat =
        1 +
        Math.sin(time * 3) * 0.025;

    heart.scale.set(
        beat,
        beat,
        beat
    );

    glow.scale.set(
        beat,
        beat,
        beat
    );


    // Slowly move the stars
    stars.rotation.y += 0.0001;


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


// ==============================
// RESIZE
// ==============================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


animate();

</script>

</body>
</html>
