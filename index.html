<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Princessss Universe ❤️</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
}

#title {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;

    color: white;

    font-family: Arial;

    font-size: 24px;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff1493;

    pointer-events: none;
}

</style>

</head>

<body>

<div id="title">
PRINCESSS' UNIVERSE ❤️
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let width;
let height;

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


// ====================================
// STARS
// ====================================

const stars = [];

for (
    let i = 0;
    i < 1000;
    i++
) {

    stars.push({

        x:
            (Math.random() - 0.5)
            * 1000,

        y:
            (Math.random() - 0.5)
            * 1000,

        z:
            Math.random() * 1000

    });

}


// ====================================
// HEART PARTICLES
// ====================================

const heart = [];

for (
    let i = 0;
    i < 5000;
    i++
) {

    const t =
        Math.random()
        * Math.PI
        * 2;

    const scale =
        Math.sqrt(
            Math.random()
        );

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        ) *
        scale;

    const y =
        (
            13 *
            Math.cos(t)

            - 5 *
            Math.cos(2 * t)

            - 2 *
            Math.cos(3 * t)

            - Math.cos(4 * t)

        ) * scale;


    heart.push({

        x: x,

        y: y,

        z:
            (Math.random() - 0.5)
            * 10,

        size:
            Math.random()
            * 1.5
            + 0.3

    });

}


// ====================================
// CAMERA
// ====================================

let cameraZ = 250;


// ====================================
// ROTATION
// ====================================

let rotationX = 0;

let rotationY = 0;

let dragging = false;

let lastX = 0;

let lastY = 0;


// ====================================
// MOUSE DOWN
// ====================================

canvas.addEventListener(
    "mousedown",
    function(e) {

        dragging = true;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

    }
);


// ====================================
// MOUSE UP
// ====================================

window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


// ====================================
// MOUSE MOVE
// ====================================

window.addEventListener(
    "mousemove",
    function(e) {

        if (!dragging)
            return;


        const dx =
            e.clientX -
            lastX;


        const dy =
            e.clientY -
            lastY;


        rotationY +=
            dx * 0.01;


        rotationX +=
            dy * 0.01;


        lastX =
            e.clientX;


        lastY =
            e.clientY;

    }
);


// ====================================
// ZOOM
// ====================================

window.addEventListener(
    "wheel",
    function(e) {

        cameraZ +=
            e.deltaY
            * 0.3;


        cameraZ =
            Math.max(
                100,
                Math.min(
                    600,
                    cameraZ
                )
            );

    }
);


// ====================================
// DRAW
// ====================================

function animate(time) {

    ctx.fillStyle =
        "rgba(0,0,0,0.4)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // ================================
    // STARS
    // ================================

    for (
        const star of stars
    ) {


        star.z -= 1;


        if (star.z < 1) {

            star.z =
                1000;

        }


        const scale =
            400 /
            star.z;


        const x =
            width / 2
            +
            star.x
            * scale;


        const y =
            height / 2
            +
            star.y
            * scale;


        const size =
            scale * 2;


        ctx.fillStyle =
            "white";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    // ================================
    // HEART
    // ================================

    const heartbeat =
        1 +
        Math.sin(
            time * 0.006
        )
        * 0.04;


    for (
        const p of heart
    ) {


        let x =
            p.x;

        let y =
            p.y;

        let z =
            p.z;


        // rotate Y

        const cosY =
            Math.cos(
                rotationY
            );

        const sinY =
            Math.sin(
                rotationY
            );


        const newX =
            x * cosY -
            z * sinY;


        const newZ =
            x * sinY +
            z * cosY;


        x =
            newX;

        z =
            newZ;


        // rotate X

        const cosX =
            Math.cos(
                rotationX
            );

        const sinX =
            Math.sin(
                rotationX
            );


        const newY =
            y * cosX -
            z * sinX;


        z =
            y * sinX +
            z * cosX;


        y =
            newY;


        // heartbeat

        x *=
            heartbeat;

        y *=
            heartbeat;


        // camera

        const depth =
            cameraZ /
            (
                cameraZ -
                z
            );


        const screenX =
            width / 2 +
            x * 7 *
            depth;


        const screenY =
            height / 2 -
            y * 7 *
            depth;


        const size =
            p.size *
            depth;


        // glow

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#ff1493";


        ctx.fillStyle =
            "#ff4fa3";


        ctx.beginPath();


        ctx.arc(
            screenX,
            screenY,
            size,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    ctx.shadowBlur = 0;


    requestAnimationFrame(
        animate
    );

}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
