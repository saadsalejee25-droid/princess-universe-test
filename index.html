<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princessss Universe ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

canvas {
    display: block;
}

#text {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial;
    font-size: 24px;
    letter-spacing: 4px;
}
</style>
</head>

<body>

<div id="text">PRINCESSS' UNIVERSE ❤️</div>

<canvas id="space"></canvas>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


// Stars

const stars = [];

for (let i = 0; i < 500; i++) {

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.5
    });

}


// Draw

function animate() {

    ctx.fillStyle = "black";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Stars

    for (const star of stars) {

        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
        }

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // Heart

    const x = canvas.width / 2;
    const y = canvas.height / 2;

    ctx.save();

    ctx.translate(x, y);

    ctx.scale(10, 10);

    ctx.beginPath();

    ctx.moveTo(0, 3);

    ctx.bezierCurveTo(
        -5, -2,
        -8, 2,
        0, 8
    );

    ctx.bezierCurveTo(
        8, 2,
        5, -2,
        0, 3
    );

    ctx.fillStyle = "#ff4fa3";

    ctx.shadowColor = "#ff1493";

    ctx.shadowBlur = 25;

    ctx.fill();

    ctx.restore();


    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
