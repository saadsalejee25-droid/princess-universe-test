<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Princessss' Universe ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
}

#title {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 24px;
    letter-spacing: 4px;
    text-shadow:
        0 0 10px #ff4fa3,
        0 0 25px #ff1493;
    pointer-events: none;
    z-index: 2;
}

#instruction {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.65);
    font-family: Arial, sans-serif;
    font-size: 14px;
    pointer-events: none;
    z-index: 2;
}
</style>
</head>

<body>

<div id="title">PRINCESSS' UNIVERSE ❤️</div>

<div id="instruction">
Drag to explore • Scroll to zoom
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


// ======================================
// STAR FIELD
// ======================================

const stars = [];

const STAR_COUNT = 450;

for (let i = 0; i < STAR_COUNT; i++) {

    stars.push({

        x: Math.random() * width,

        y: Math.random() * height,

        size:
            Math.random() * 1.4 + 0.3,

        speed:
            Math.random() * 0.25 + 0.05

    });

}


// ======================================
// HEART PARTICLES
// ======================================

const heart = [];

const PARTICLE_COUNT = 2600;

for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
) {

    const t =
        Math.random() *
        Math.PI *
        2;

    const scale =
        Math.sqrt(
            Math.random()
        );

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        ) *
        scale;

    const y =
        (
            13 *
            Math.cos(t)

            - 5 *
            Math.cos(2 * t)

            - 2 *
            Math.cos(3 * t)

            - Math.cos(4 * t)

        ) * scale;

    heart.push({

        x: x,

        y: y,

        z:
            (Math.random() - 0.5)
            * 8,

        size:
            Math.random() * 1.3
            + 0.35

    });

}


// ======================================
// CAMERA
// ======================================

let cameraZ = 250;


// ======================================
// ROTATION
// ======================================

let rotationX = 0;

let rotationY = 0;

let targetRotationX = 0;

let targetRotationY = 0;

let dragging = false;

let lastX = 0;

let lastY = 0;


// ======================================
// MOUSE DOWN
// ======================================

canvas.addEventListener(
    "mousedown",
    function(e) {

        dragging = true;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

    }
);


// ======================================
// MOUSE UP
// ======================================

window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


// ======================================
// MOUSE MOVE
// ======================================

window.addEventListener(
    "mousemove",
    function(e) {

        if (!dragging)
            return;

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        targetRotationY +=
            dx * 0.008;

        targetRotationX +=
            dy * 0.008;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

    }
);


// ======================================
// ZOOM
// ======================================

window.addEventListener(
    "wheel",
    function(e) {

        cameraZ +=
            e.deltaY * 0.25;

        cameraZ =
            Math.max(
                120,
                Math.min(
                    500,
                    cameraZ
                )
            );

    },
    { passive: true }
);


// ======================================
// DRAW
// ======================================

function animate(time) {

    requestAnimationFrame(
        animate
    );


    // Smooth rotation

    rotationX +=
        (
            targetRotationX -
            rotationX
        ) * 0.12;

    rotationY +=
        (
            targetRotationY -
            rotationY
        ) * 0.12;


    // Clear screen

    ctx.fillStyle =
        "rgba(0,0,0,0.45)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // ==================================
    // STARS
    // ==================================

    ctx.fillStyle =
        "white";

    for (
        const star of stars
    ) {

        star.y +=
            star.speed;

        if (
            star.y >
            height
        ) {

            star.y = 0;

        }

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // ==================================
    // HEARTBEAT
    // ==================================

    const beat =
        1 +
        Math.sin(
            time * 0.006
        ) * 0.035;


    // ==================================
    // PRE-CALCULATED ROTATION
    // ==================================

    const cosY =
        Math.cos(
            rotationY
        );

    const sinY =
        Math.sin(
            rotationY
        );

    const cosX =
        Math.cos(
            rotationX
        );

    const sinX =
        Math.sin(
            rotationX
        );


    // ==================================
    // HEART
    // ==================================

    ctx.shadowBlur = 8;

    ctx.shadowColor =
        "#ff1493";

    ctx.fillStyle =
        "#ff4fa3";


    for (
        const p of heart
    ) {

        // Y rotation

        let x =
            p.x * cosY -
            p.z * sinY;

        let z =
            p.x * sinY +
            p.z * cosY;


        // X rotation

        let y =
            p.y * cosX -
            z * sinX;

        z =
            p.y * sinX +
            z * cosX;


        // Heartbeat

        x *= beat;

        y *= beat;


        // Perspective

        const depth =
            cameraZ /
            (
                cameraZ - z
            );


        const screenX =
            width / 2 +
            x * 7 *
            depth;


        const screenY =
            height / 2 -
            y * 7 *
            depth;


        const size =
            p.size *
            depth;


        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.shadowBlur = 0;

}


// Start

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
