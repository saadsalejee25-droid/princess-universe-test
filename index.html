<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princessss' Universe ❤️</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}

#title{
    position:fixed;
    top:25px;
    width:100%;
    text-align:center;
    color:white;
    font-family:Arial,sans-serif;
    font-size:24px;
    letter-spacing:4px;
    text-shadow:0 0 10px #ff4fa3,0 0 25px #ff1493;
    pointer-events:none;
    z-index:10;
}

#hint{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.65);
    font-family:Arial,sans-serif;
    font-size:13px;
    pointer-events:none;
    z-index:10;
}

#popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(10,0,15,.96);
    border:1px solid rgba(255,79,163,.7);
    border-radius:20px;
    padding:30px;
    width:min(360px,75vw);
    text-align:center;
    color:white;
    font-family:Arial,sans-serif;
    box-shadow:0 0 40px rgba(255,20,147,.35);
    display:none;
    z-index:20;
}

#popup h2{
    margin-top:0;
}

#popup button{
    margin-top:15px;
    padding:10px 22px;
    border:0;
    border-radius:20px;
    background:#ff4fa3;
    color:white;
    cursor:pointer;
}
    /* =========================
   BIRTHDAY INTRO
========================= */

#birthdayIntro {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #26001f 0%,
            #090006 55%,
            #000000 100%
        );

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;

}


/* CONTENT */

.introContent {

    width: 90%;

    max-width: 700px;

    animation:
        introAppear 2s ease;
}


@keyframes introAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* SMALL TEXT */

.introSmall {

    color:
        rgba(
            255,
            255,
            255,
            .55
        );

    font-size: 13px;

    letter-spacing: 4px;

    margin-bottom: 25px;
}


/* TITLE */

.introContent h1 {

    font-size:
        clamp(
            40px,
            8vw,
            75px
        );

    line-height: 1.1;

    margin: 0;

    color: white;

    text-shadow:
        0 0 20px
        rgba(
            255,
            20,
            147,
            .7
        );
}


.introContent h1 span {

    display: block;

    color:
        #ff6bb5;

    margin-top: 10px;

}


/* DESCRIPTION */

.introContent p {

    margin-top: 30px;

    margin-bottom: 40px;

    color:
        rgba(
            255,
            255,
            255,
            .65
        );

    font-size: 18px;

    font-family:
        Arial,
        sans-serif;

}


/* ENTER BUTTON */

#enterUniverse {

    padding:
        16px
        34px;

    border:
        1px solid
        rgba(
            255,
            120,
            190,
            .7
        );

    border-radius:
        50px;

    background:
        rgba(
            255,
            40,
            150,
            .12
        );

    color: white;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 25px
        rgba(
            255,
            20,
            147,
            .25
        );

    transition:
        transform .3s,
        box-shadow .3s,
        background .3s;

}


#enterUniverse:hover {

    transform:
        scale(1.07);

    background:
        rgba(
            255,
            40,
            150,
            .25
        );

    box-shadow:
        0 0 45px
        rgba(
            255,
            20,
            147,
            .55
        );

}


/* HIDDEN STATE */

#birthdayIntro.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}
    /* CINEMATIC UNIVERSE ENTRANCE */

.universeEntering canvas {

    opacity: 0;

    transform: scale(0.85);

    transition:
        opacity 2.5s ease,
        transform 2.5s ease;
}

body:not(.universeEntering) canvas {

    opacity: 1;

    transform: scale(1);

    transition:
        opacity 1s ease,
        transform 1s ease;
}
    /* =========================
   HIDDEN STAR COUNTER
========================= */

#starCounter {

    position: fixed;

    top: 25px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 1000;

    padding: 10px 20px;

    border-radius: 30px;

    background:
        rgba(0,0,0,0.35);

    border:
        1px solid
        rgba(255,255,255,0.2);

    color: white;

    font-family:
        Arial,
        sans-serif;

    font-size: 13px;

    letter-spacing: 1px;

    backdrop-filter:
        blur(8px);

    box-shadow:
        0 0 20px
        rgba(255,255,255,0.08);

    opacity: 0.8;

    transition:
        transform .3s,
        box-shadow .3s;

}

#starCounter:hover {

    transform:
        translateX(-50%)
        scale(1.05);

    box-shadow:
        0 0 25px
        rgba(255,255,255,0.15);

}
</style>
</head>

<body>

    <!-- BIRTHDAY INTRO -->

<div id="birthdayIntro">

    <div class="introStars"></div>

    <div class="introContent">

        <div class="introSmall">
            ✨ A LITTLE UNIVERSE MADE FOR YOU ✨
        </div>

        <h1>
            Happy Birthday,
            <span>Princessss ❤️</span>
        </h1>

        <p>
            I made something special for you...
        </p>

        <button
            id="enterUniverse"
            onclick="enterUniverse()"
        >
            ENTER YOUR UNIVERSE ✨
        </button>

    </div>

</div>
<div id="title">PRINCESSS' UNIVERSE ❤️</div>

<div id="hint">
Drag to explore • Scroll to zoom • Click a planet
</div>

<div id="popup">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Return to Universe</button>
</div>

<canvas id="canvas"></canvas>
    <!-- HIDDEN STAR COUNTER -->

<div id="starCounter">

    ⭐ STARS FOUND:
    <span id="starsFound">0</span>/5

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let width;
let height;

function resize(){
    width=canvas.width=window.innerWidth;
    height=canvas.height=window.innerHeight;
}

resize();

window.addEventListener("resize",resize);


// ================================
// STARS
// ================================

const stars=[];

for(let i=0;i<450;i++){

    stars.push({
        x:Math.random()*width,
        y:Math.random()*height,
        size:Math.random()*1.4+0.3,
        speed:Math.random()*0.25+0.05
    });

}


// ================================
// HEART
// ================================

const heart=[];

const PARTICLE_COUNT=2600;

for(let i=0;i<PARTICLE_COUNT;i++){

    const t=Math.random()*Math.PI*2;

    const scale=Math.sqrt(Math.random());

    const x=
        16*
        Math.pow(Math.sin(t),3)*
        scale;

    const y=
        (
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
        )*scale;

    heart.push({
        x:x,
        y:y,
        z:(Math.random()-0.5)*8,
        size:Math.random()*1.3+0.35
    });

}


// ================================
// PLANETS
// ================================

const planets=[

    {
        name:"OUR PICTURES",
        description:"A whole collection of our favourite memories together ❤️",
        angle:0,
        distance:32,
        size:4,
        color:"#ff4fa3"
    },

    {
        name:"OUR SONG",
        description:"A song that reminds me of you 🎵",
        angle:Math.PI*2/3,
        distance:40,
        size:4.5,
        color:"#9b6cff"
    },

    {
        name:"MY LETTER",
        description:"Something I wrote especially for my Princessss 💌",
        angle:Math.PI*4/3,
        distance:36,
        size:4,
        color:"#ff8ac5"
    }

];


// ================================
// CAMERA
// ================================

let cameraZ=250;


// ================================
// ROTATION
// ================================

let rotationX=0;
let rotationY=0;

let targetRotationX=0;
let targetRotationY=0;

let dragging=false;

let lastX=0;
let lastY=0;


// ================================
// MOUSE DRAG
// ================================

canvas.addEventListener("mousedown",function(e){

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;

});

window.addEventListener("mouseup",function(){

    dragging=false;

});

window.addEventListener("mousemove",function(e){

    if(!dragging)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    targetRotationY+=dx*0.008;
    targetRotationX+=dy*0.008;

    lastX=e.clientX;
    lastY=e.clientY;

});


// ================================
// ZOOM
// ================================

window.addEventListener("wheel",function(e){

    cameraZ+=e.deltaY*0.25;

    cameraZ=Math.max(
        120,
        Math.min(500,cameraZ)
    );

},{passive:true});


// ================================
// PLANET CLICK
// ================================

canvas.addEventListener("click", function(e) {

    const rect = canvas.getBoundingClientRect();

    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    for (const planet of planets) {

        if (!planet.screenX) continue;

        const dx = mouseX - planet.screenX;
        const dy = mouseY - planet.screenY;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < planet.size * 5) {

            if (planet.name === "OUR PICTURES") {

                window.location.href = "photos.html";

            }

            else if (planet.name === "OUR SONG") {

                window.location.href = "song.html";

            }

            else if (planet.name === "MY LETTER") {

                window.location.href = "letter.html";

            }

            break;
        }
    }

});


function closePopup(){

    document.getElementById("popup").style.display=
        "none";

}


// ================================
// ANIMATION
// ================================

function animate(time){

   drawHiddenStars();
    requestAnimationFrame(animate);


    // Smooth rotation

    rotationX+=
        (targetRotationX-rotationX)*0.12;

    rotationY+=
        (targetRotationY-rotationY)*0.12;


    // Background

    ctx.fillStyle="rgba(0,0,0,0.45)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    // ============================
    // STARS
    // ============================

    ctx.fillStyle="white";

    for(const star of stars){

        star.y+=star.speed;

        if(star.y>height){
            star.y=0;
        }

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    // ============================
    // HEARTBEAT
    // ============================

    const beat=
        1+
        Math.sin(time*0.006)*0.035;


    const cosY=Math.cos(rotationY);
    const sinY=Math.sin(rotationY);

    const cosX=Math.cos(rotationX);
    const sinX=Math.sin(rotationX);


    // ============================
    // HEART
    // ============================

    ctx.shadowBlur=8;
    ctx.shadowColor="#ff1493";
    ctx.fillStyle="#ff4fa3";

    for(const p of heart){

        let x=
            p.x*cosY-
            p.z*sinY;

        let z=
            p.x*sinY+
            p.z*cosY;

        let y=
            p.y*cosX-
            z*sinX;

        z=
            p.y*sinX+
            z*cosX;


        x*=beat;
        y*=beat;


        const depth=
            cameraZ/
            (cameraZ-z);


        const screenX=
            width/2+
            x*7*depth;

        const screenY=
            height/2-
            y*7*depth;

        const size=
            p.size*depth;


        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    // ============================
    // PLANETS
    // ============================

   for(const planet of planets){

    planet.angle += 0.0015;

    const px = Math.cos(planet.angle) * planet.distance;
    const py = Math.sin(planet.angle) * planet.distance;

    let x = px * cosY;
    let z = px * sinY;

    let y = py * cosX - z * sinX;

    z = py * sinX + z * cosX;

    const depth = cameraZ / (cameraZ - z);

    const screenX = width / 2 + x * 7 * depth;
    const screenY = height / 2 - y * 7 * depth;
    const size = planet.size * depth;

    planet.screenX = screenX;
    planet.screenY = screenY;


    // ORBIT

    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.arc(
        width / 2,
        height / 2,
        planet.distance * 7,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // PLANET GLOW

    ctx.shadowBlur = 30;
    ctx.shadowColor = planet.color;


    // PLANET

    const gradient = ctx.createRadialGradient(
        screenX - size * 0.35,
        screenY - size * 0.35,
        size * 0.1,
        screenX,
        screenY,
        size
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.15, planet.color);
    gradient.addColorStop(0.65, planet.color);
    gradient.addColorStop(1, "#16000f");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        size,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // RING AROUND OUR PICTURES

    if(planet.name === "OUR PICTURES"){

        ctx.save();

        ctx.translate(
            screenX,
            screenY
        );

        ctx.rotate(-0.25);

        ctx.strokeStyle =
            "rgba(255,180,220,0.8)";

        ctx.lineWidth =
            Math.max(1, size * 0.12);

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            size * 1.8,
            size * 0.45,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
    }


    // MOON AROUND MY LETTER

    if(planet.name === "MY LETTER"){

        const moonAngle =
            time * 0.0015;

        const moonDistance =
            size * 1.8;

        const moonX =
            screenX +
            Math.cos(moonAngle) *
            moonDistance;

        const moonY =
            screenY +
            Math.sin(moonAngle) *
            moonDistance *
            0.5;

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffffff";

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            moonX,
            moonY,
            Math.max(1.5, size * 0.22),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    // PLANET LABEL

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "rgba(255,255,255,0.9)";

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        planet.name,
        screenX,
        screenY + size + 20
    );

}




    ctx.shadowBlur=0;

}

requestAnimationFrame(animate);

   function enterUniverse(){

    const intro =
        document.getElementById(
            "birthdayIntro"
        );

    intro.classList.add("hide");

    document.body.classList.add(
        "universeEntering"
    );

    setTimeout(() => {

        document.body.classList.remove(
            "universeEntering"
        );

    }, 2800);

}
    // =========================
// HIDDEN STAR HUNT
// =========================

const hiddenStars = [

    { x: 0.18, y: 0.25, found: false },
    { x: 0.78, y: 0.20, found: false },
    { x: 0.30, y: 0.75, found: false },
    { x: 0.72, y: 0.72, found: false },
    { x: 0.50, y: 0.12, found: false }

];

function drawHiddenStars() {

    for (const star of hiddenStars) {

        if (star.found) continue;

        const x = canvas.width * star.x;
        const y = canvas.height * star.y;

        ctx.save();

        ctx.shadowBlur = 18;
        ctx.shadowColor = "#ffffff";

        ctx.fillStyle = "white";

        ctx.font = "18px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText("✦", x, y);

        ctx.restore();
    }
}


function checkHiddenStar(x, y) {

    for (const star of hiddenStars) {

        if (star.found) continue;

        const starX = canvas.width * star.x;
        const starY = canvas.height * star.y;

        const distance = Math.sqrt(
            (x - starX) * (x - starX) +
            (y - starY) * (y - starY)
        );

        if (distance < 35) {

            star.found = true;

            const total =
                hiddenStars.filter(
                    s => s.found
                ).length;

            document.getElementById(
                "starsFound"
            ).textContent = total;

            if (total === 5) {

                setTimeout(() => {

                    alert(
                        "⭐ 5/5 STARS FOUND! ⭐\n\n" +
                        "You found them all, Princessss... ❤️"
                    );

                }, 400);
            }

            return true;
        }
    }

    return false;
}


canvas.addEventListener(
    "click",
    function(e) {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            (e.clientX - rect.left) *
            (canvas.width / rect.width);

        const y =
            (e.clientY - rect.top) *
            (canvas.height / rect.height);

        checkHiddenStar(x, y);

    }
);
</script>

</body>
</html>
